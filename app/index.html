<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>Vice Cover Studio</h1>
      <p>Turn any photo into GTA 6-style cover art. Your photos never leave your machine — everything runs offline in this page.</p>
    </header>

    <div class="group">
      <label class="field">Photos
        <input id="photo" type="file" accept="image/*" multiple>
      </label>
      <div id="strip" class="strip" aria-label="Your photos — click one to put it in the selected panel"></div>
      <div class="row">
        <button id="fill-all" type="button" class="ghost">Fill all panels with this photo</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Layout</span>
      <div id="layouts" class="opts" role="group" aria-label="Layout"></div>
    </div>

    <div class="group">
      <span class="label">Colour grade</span>
      <div id="grades" class="opts" role="group" aria-label="Colour grade"></div>
    </div>

    <div class="group">
      <label class="field">Title
        <input id="title" type="text" maxlength="32" value="Sunset Heist">
      </label>
      <label class="field">Subtitle (script)
        <input id="subtitle" type="text" maxlength="32" value="Vice City nights">
      </label>
      <span class="label">Title fill</span>
      <div id="title-styles" class="opts" role="group" aria-label="Title fill"></div>
    </div>

    <div class="group">
      <span class="label" id="panel-label">Panel 1 of 4</span>
      <p class="hint">Click a panel in the preview, drag to move its photo, scroll to zoom.</p>
      <label class="field">Zoom
        <input id="zoom" type="range" min="100" max="300" value="100">
      </label>
      <div class="row">
        <button id="reset-panel" type="button" class="ghost">Reset panel position</button>
      </div>
    </div>

    <div class="group">
      <span class="label">Export size</span>
      <div id="sizes" class="opts" role="group" aria-label="Export size"></div>
      <label class="check"><input id="frame" type="checkbox" checked> White poster frame</label>
      <label class="check"><input id="badge" type="checkbox" checked> “Vice City” badge</label>
    </div>

    <div class="actions">
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="export-all" type="button">Export all 3 sizes</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="640" height="360" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
